name: Bump service worker on merge to main

# בכל מיזוג/דחיפה ל-main מעדכנים אוטומטית את גרסת ה-cache של ה-Service Worker,
# כדי שהדפדפן של כל משתמש יזהה שינוי וידחוף את הגרסה החדשה (index.html מעודכן).
on:
  push:
    branches:
      - main
    # מתעלמים מדחיפות שנוגעות רק ל-service-worker.js (כלומר הקומיט שה-Action עצמו יוצר),
    # כדי למנוע לולאה אינסופית של הפעלות.
    paths-ignore:
      - 'service-worker.js'

# מונע ריצות חופפות אם נדחפים כמה מיזוגים ברצף.
concurrency:
  group: bump-service-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update cache version in service-worker.js
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NEW_VERSION="or-hatfila-${SHORT_SHA}"
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = '${NEW_VERSION}';/" service-worker.js
          echo "Cache version set to ${NEW_VERSION}"
          git diff --stat

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- service-worker.js; then
            echo "No change to service-worker.js — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "Auto-bump service worker cache version [skip ci]"
          git push
