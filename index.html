<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אור התפילה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4AF37;
    --gold-light: #F5D96B;
    --gold-dark: #A07C10;
    --deep-blue: #0A0E2E;
    --navy: #111844;
    --purple: #1E0A4E;
    --crimson: #8B0000;
    --teal: #005B6E;
    --green-dark: #1A4A2E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep-blue);
    font-family: 'Frank Ruhl Libre', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 50%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 40%, rgba(212,175,55,0.4) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px 20px;
    margin-top: 30px;
  }

  .header-star {
    font-size: 36px;
    display: block;
    margin-bottom: 8px;
    animation: spin-slow 20s linear infinite;
    filter: drop-shadow(0 0 10px rgba(212,175,55,0.8));
  }

  .font-size-control {
    position: fixed;
    left: 14px;
    top: 14px;
    z-index: 50;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 20px;
    padding: 6px 10px;
    backdrop-filter: blur(8px);
  }

  .font-size-control span {
    color: rgba(212,175,55,0.5);
    font-family: 'Heebo', sans-serif;
    font-size: 11px;
    writing-mode: horizontal-tb;
    transform: none;
    letter-spacing: 1px;
    margin: 0;
  }

  .font-btn {
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .font-btn:hover { background: rgba(212,175,55,0.28); }

  .font-size-display {
    color: var(--gold-light);
    font-family: 'Heebo', sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }

  .bsd {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 50;
    color: var(--gold-light);
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(212,175,55,0.6);
    letter-spacing: 1px;
  }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .header h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 48px);
    color: var(--gold-light);
    text-shadow:
      0 0 20px rgba(212,175,55,0.8),
      0 0 40px rgba(212,175,55,0.4),
      0 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .header p {
    color: rgba(212,175,55,0.6);
    font-size: 14px;
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
    letter-spacing: 3px;
  }

  .divider {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 16px auto 0;
  }

  /* Banners container */
  .banners {
    position: relative;
    z-index: 10;
    padding: 30px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* 3D Banner */
  .banner {
    position: relative;
    cursor: pointer;
    border-radius: 16px;
    transform: perspective(1000px) rotateX(0deg);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease;
    animation: fadeSlideIn 0.6s ease both;
  }

  .banner:nth-child(1) { animation-delay: 0.1s; }
  .banner:nth-child(2) { animation-delay: 0.2s; }
  .banner:nth-child(3) { animation-delay: 0.3s; }
  .banner:nth-child(4) { animation-delay: 0.4s; }
  .banner:nth-child(5) { animation-delay: 0.5s; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: perspective(1000px) translateY(30px) rotateX(-5deg); }
    to { opacity: 1; transform: perspective(1000px) translateY(0) rotateX(0deg); }
  }

  .banner:hover {
    transform: perspective(1000px) rotateX(-4deg) translateY(-4px) scale(1.02);
  }

  .banner:active {
    transform: perspective(1000px) rotateX(2deg) translateY(2px) scale(0.98);
  }

  .banner-inner {
    border-radius: 16px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,0.3);
  }

  /* Gold shimmer effect */
  .banner-inner::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    transform: translateX(100%);
    transition: transform 0.6s ease;
  }

  .banner:hover .banner-inner::before {
    transform: translateX(-100%);
  }

  /* Each banner unique gradient */
  .banner-1 .banner-inner {
    background: linear-gradient(135deg, #1A0A3E 0%, #2D1060 40%, #0A1A4E 100%);
    box-shadow: 0 10px 40px rgba(80,20,160,0.5), inset 0 1px 0 rgba(212,175,55,0.2);
  }
  .banner-1:hover { box-shadow: 0 20px 60px rgba(80,20,160,0.7); }

  .banner-2 .banner-inner {
    background: linear-gradient(135deg, #2A0A0A 0%, #5C1010 40%, #1A0A20 100%);
    box-shadow: 0 10px 40px rgba(139,0,0,0.5), inset 0 1px 0 rgba(212,175,55,0.2);
  }
  .banner-2:hover { box-shadow: 0 20px 60px rgba(139,0,0,0.7); }

  .banner-3 .banner-inner {
    background: linear-gradient(135deg, #002A3A 0%, #005B6E 40%, #001A30 100%);
    box-shadow: 0 10px 40px rgba(0,91,110,0.5), inset 0 1px 0 rgba(212,175,55,0.2);
  }
  .banner-3:hover { box-shadow: 0 20px 60px rgba(0,91,110,0.7); }

  .banner-4 .banner-inner {
    background: linear-gradient(135deg, #1A0A00 0%, #5C3010 40%, #2A1A00 100%);
    box-shadow: 0 10px 40px rgba(180,100,0,0.5), inset 0 1px 0 rgba(212,175,55,0.2);
  }
  .banner-4:hover { box-shadow: 0 20px 60px rgba(180,100,0,0.7); }

  .banner-5 .banner-inner {
    background: linear-gradient(135deg, #001A15 0%, #004A35 40%, #001020 100%);
    box-shadow: 0 10px 40px rgba(0,100,70,0.5), inset 0 1px 0 rgba(212,175,55,0.2);
  }
  .banner-5:hover { box-shadow: 0 20px 60px rgba(0,100,70,0.7); }

  /* Decorative gold corners */
  .banner-inner::after {
    content: '';
    position: absolute;
    top: 8px; right: 8px;
    width: 20px; height: 20px;
    border-top: 2px solid rgba(212,175,55,0.5);
    border-right: 2px solid rgba(212,175,55,0.5);
    border-radius: 0 4px 0 0;
  }

  .banner-icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
    filter: drop-shadow(0 0 8px rgba(212,175,55,0.6));
  }

  .banner-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 26px);
    color: var(--gold-light);
    text-shadow: 0 0 15px rgba(212,175,55,0.5), 0 2px 4px rgba(0,0,0,0.8);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .banner-subtitle {
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    color: rgba(212,175,55,0.55);
    font-weight: 300;
    letter-spacing: 1px;
  }

  .banner-arrow {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(212,175,55,0.4);
    font-size: 20px;
    transition: transform 0.3s, color 0.3s;
  }

  .banner:hover .banner-arrow {
    transform: translateY(-50%) translateX(-4px);
    color: var(--gold);
  }

  /* ===== PRAYER OVERLAY ===== */
  .prayer-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .prayer-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .prayer-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #050818 0%, #0A0E2E 100%);
  }

  .prayer-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(212,175,55,0.2);
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
  }

  .prayer-header-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--gold-light);
    text-shadow: 0 0 10px rgba(212,175,55,0.5);
    flex: 1;
    text-align: center;
  }

  .close-btn {
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.2s;
    font-family: 'Heebo', sans-serif;
    flex-shrink: 0;
  }

  .close-btn:hover { background: rgba(212,175,55,0.3); transform: scale(1.1); }

  .prayer-content {
    position: relative;
    z-index: 2;
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px 50px;
    -webkit-overflow-scrolling: touch;
  }

  .prayer-content::-webkit-scrollbar { width: 4px; }
  .prayer-content::-webkit-scrollbar-track { background: transparent; }
  .prayer-content::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 2px; }

  .prayer-text {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: clamp(22px, 5.4vw, 29px);
    line-height: 2.2;
    color: rgba(255, 248, 220, 0.95);
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    direction: rtl;
  }

  .prayer-text .section-title {
    color: var(--gold-light);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    display: block;
    margin: 24px 0 12px;
    text-shadow: 0 0 10px rgba(212,175,55,0.4);
    border-bottom: 1px solid rgba(212,175,55,0.2);
    padding-bottom: 8px;
  }

  .prayer-text .highlight {
    color: var(--gold-light);
    font-weight: 700;
  }

  .tzaddik-btn {
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.35);
    color: var(--gold-light);
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 17px;
    padding: 12px 16px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    direction: rtl;
    width: 100%;
  }
  .tzaddik-btn:hover { background: rgba(212,175,55,0.22); }
  .tzaddik-btn.selected {
    background: rgba(212,175,55,0.28);
    border-color: var(--gold);
    transform: scale(1.02);
    box-shadow: 0 0 12px rgba(212,175,55,0.3);
  }
  .tzaddik-date {
    display: block;
    font-size: 13px;
    color: rgba(212,175,55,0.5);
    margin-top: 3px;
    font-family: 'Heebo', sans-serif;
    font-weight: 300;
  }

  .month-btn {
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 16px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    direction: rtl;
    min-width: 80px;
  }
  .month-btn:hover { background: rgba(212,175,55,0.2); }
  .month-btn.selected {
    background: rgba(212,175,55,0.28);
    border-color: var(--gold);
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(212,175,55,0.3);
  }

  .scroll-controls {
    position: relative;
    z-index: 3;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 20px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(212,175,55,0.15);
    backdrop-filter: blur(8px);
  }
  .scroll-controls.visible { display: flex; }

  .scroll-btn {
    background: rgba(212,175,55,0.12);
    border: 1px solid rgba(212,175,55,0.35);
    color: var(--gold-light);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .scroll-btn:hover { background: rgba(212,175,55,0.25); }
  .scroll-btn.active {
    background: rgba(212,175,55,0.3);
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.3);
  }

  .scroll-speed {
    display: none;
    align-items: center;
    gap: 8px;
    color: rgba(212,175,55,0.6);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
  }
  .scroll-speed.visible { display: flex; }
  .scroll-speed input[type=range] {
    -webkit-appearance: none;
    width: 80px; height: 4px;
    background: rgba(212,175,55,0.3);
    border-radius: 2px;
    outline: none;
  }
  .scroll-speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
  }

  /* Candle flame animation */
  .candle-container {
    text-align: center;
    margin: 20px 0;
  }

  .flame {
    font-size: 48px;
    display: inline-block;
    animation: flicker 1.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 12px rgba(255,140,0,0.8));
  }

  @keyframes flicker {
    0% { transform: scaleY(1) scaleX(1) rotate(-1deg); opacity: 1; }
    25% { transform: scaleY(1.05) scaleX(0.97) rotate(1deg); opacity: 0.95; }
    50% { transform: scaleY(0.97) scaleX(1.02) rotate(-0.5deg); opacity: 1; }
    75% { transform: scaleY(1.03) scaleX(0.98) rotate(0.8deg); opacity: 0.97; }
    100% { transform: scaleY(1) scaleX(1) rotate(-0.5deg); opacity: 1; }
  }

  /* Gold ornament */
  .ornament {
    text-align: center;
    color: rgba(212,175,55,0.4);
    font-size: 24px;
    margin: 20px 0;
    letter-spacing: 8px;
  }
</style>
</head>
<body>

<div class="bsd">בס"ד</div>

<div class="font-size-control">
  <button class="font-btn" onclick="changeFontSize(10)">A+</button>
  <div class="font-size-display" id="fontDisplay">100%</div>
  <button class="font-btn" onclick="changeFontSize(-10)">A-</button>
  <span>גודל גופן</span>
</div>

<!-- Header -->
<div class="header">
  <span class="header-star">✡</span>
  <h1>אור התפילה</h1>
  <p>אוסף תפילות ובקשות</p>
  <div class="divider"></div>
</div>

<!-- Banners -->
<div class="banners">

  <div class="banner banner-1" onclick="openPrayer('derech')">
    <div class="banner-inner">
      <span class="banner-icon">🛤️</span>
      <div class="banner-title">תפילת הדרך</div>
      <div class="banner-subtitle">לנוסעים ולמטיילים</div>
      <span class="banner-arrow">◀</span>
    </div>
  </div>

  <div class="banner banner-2" onclick="openPrayer('mazon')">
    <div class="banner-inner">
      <span class="banner-icon">🍞</span>
      <div class="banner-title">ברכת המזון</div>
      <div class="banner-subtitle">נוסח ספרדי</div>
      <span class="banner-arrow">◀</span>
    </div>
  </div>

  <div class="banner banner-3" onclick="openPrayer('chayalim')">
    <div class="banner-inner">
      <span class="banner-icon">🛡️</span>
      <div class="banner-title">תפילה לחיילי צה"ל</div>
      <div class="banner-subtitle">ופרקי תהילים מיוחדים</div>
      <span class="banner-arrow">◀</span>
    </div>
  </div>

  <div class="banner banner-4" onclick="openPrayer('hilula')">
    <div class="banner-inner">
      <span class="banner-icon">🕯️</span>
      <div class="banner-title">הדלקת נר בהילולה</div>
      <div class="banner-subtitle">לכבוד הצדיקים</div>
      <span class="banner-arrow">◀</span>
    </div>
  </div>

  <div class="banner banner-5" onclick="openPrayer('roshchodesh')">
    <div class="banner-inner">
      <span class="banner-icon">🌙</span>
      <div class="banner-title">הדלקת נר ראש חודש</div>
      <div class="banner-subtitle">תפילה לחידוש הלבנה</div>
      <span class="banner-arrow">◀</span>
    </div>
  </div>

</div>

<!-- Prayer Overlay -->
<div class="prayer-overlay" id="prayerOverlay">
  <div class="prayer-bg"></div>
  <div class="prayer-header">
    <div style="width:38px"></div>
    <div class="prayer-header-title" id="prayerTitle"></div>
    <button class="close-btn" onclick="closePrayer()">✕</button>
  </div>
  <div class="scroll-controls" id="scrollControls">
    <button class="scroll-btn" id="btnManual" onclick="setManualScroll()">✋ גלילה ידנית</button>
    <button class="scroll-btn" id="btnAuto" onclick="toggleAutoScroll()">▶ גלילה אוטומטית</button>
    <div class="scroll-speed" id="speedControl">
      <span>🐢</span>
      <input type="range" id="scrollSpeedSlider" min="1" max="5" value="2" oninput="updateScrollSpeed(this.value)">
      <span>🐇</span>
    </div>
  </div>
  <div class="prayer-content">
    <div class="prayer-text" id="prayerBody"></div>
  </div>
</div>

<script>
const prayers = {
  derech: {
    title: "תפילת הדרך",
    body: `
      <span class="section-title">✦ תפילת הדרך ✦</span>
      <span class="highlight">יְהִי רָצוֹן מִלְפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ,</span><br><br>
      שֶׁתּוֹלִיכֵנוּ לְשָׁלוֹם וְתַצְעִידֵנוּ לְשָׁלוֹם<br>
      וְתַדְרִיכֵנוּ לְשָׁלוֹם, וְתִסְמְכֵנוּ לְשָׁלוֹם,<br><br>
      וְתַגִּיעֵנוּ לִמְחוֹז חֶפְצֵנוּ<br>
      לְחַיִּים וּלְשִׂמְחָה וּלְשָׁלוֹם.

      <div class="ornament">✦ ✦ ✦</div>

let currentFontPercent = 100;

function changeFontSize(delta) {
  currentFontPercent = Math.min(200, Math.max(60, currentFontPercent + delta));
  document.getElementById('fontDisplay').textContent = currentFontPercent + '%';
  applyFontSize();
}

function applyFontSize() {
  const el = document.querySelector('.prayer-text');
  if (el) el.style.fontSize = (22 * currentFontPercent / 100) + 'px';
}

function selectNissim(type, btn) {
  const nissimText = document.getElementById('nissimText');
  const nissimBody = document.getElementById('nissimBody');
  btn.closest('div').querySelectorAll('.month-btn').forEach(b => b.classList.remove('selected'));

  if (type === 'none') {
    nissimText.style.display = 'none';
    return;
  }

  btn.classList.add('selected');
  nissimText.style.display = 'block';

  if (type === 'chanuka') {
    nissimBody.innerHTML = `בִּימֵי מַתִּתְיָה בֶן יוֹחָנָן כֹּהֵן גָּדוֹל חַשְׁמוֹנָאִי וּבָנָיו<br>
    כְּשֶׁעָמְדָה מַלְכוּת יָוָן הָרְשָׁעָה עַל עַמְּךָ יִשְׂרָאֵל לְשַׁכְּחָם תּוֹרָתָךְ<br>
    וּלְהַעֲבִירָם מֵחֻקֵּי רְצוֹנָךְ.<br>
    וְאַתָּה בְרַחֲמֶיךָ הָרַבִּים עָמַדְתָּ לָהֶם בְּעֵת צָרָתָם.<br>
    רַבְתָּ אֶת רִיבָם. דַּנְתָּ אֶת דִּינָם. נָקַמְתָּ אֶת נִקְמָתָם.<br>
    מָסַרְתָּ גִּבּוֹרִים בְּיַד חֲלָשִׁים. וְרַבִּים בְּיַד מְעַטִּים.<br>
    וּרְשָׁעִים בְּיַד צַדִּיקִים. וּטְמֵאִים בְּיַד טְהוֹרִים.<br>
    וְזֵדִים בְּיַד עוֹסְקֵי תוֹרָתֶךָ.<br>
    לְךָ עָשִׂיתָ שֵׁם גָּדוֹל וְקָדוֹשׁ בְּעוֹלָמָךְ.<br>
    וּלְעַמְּךָ יִשְׂרָאֵל עָשִׂיתָ תְּשׁוּעָה גְדוֹלָה וּפֻרְקָן כְּהַיּוֹם הַזֶּה.<br>
    וְאַחַר כָּךְ בָּאוּ בָנֶיךָ לִדְבִיר בֵּיתֶךָ וּפִנּוּ אֶת הֵיכָלֶךָ.<br>
    וְטִהֲרוּ אֶת מִקְדָּשֶׁךָ. וְהִדְלִיקוּ נֵרוֹת בְּחַצְרוֹת קָדְשֶׁךָ.<br>
    וְקָבְעוּ שְׁמוֹנַת יְמֵי חֲנֻכָּה אֵלּוּ בְּהַלֵּל וּבְהוֹדָאָה.<br>
    <span class="highlight">וְעָשִׂיתָ עִמָּהֶם נִסִּים וְנִפְלָאוֹת וְנוֹדֶה לְשִׁמְךָ הַגָּדוֹל סֶלָה:</span>`;
  } else {
    nissimBody.innerHTML = `בִּימֵי מָרְדְּכַי וְאֶסְתֵּר בְּשׁוּשַׁן הַבִּירָה.<br>
    כְּשֶׁעָמַד עֲלֵיהֶם הָמָן הָרָשָׁע.<br>
    בִּקֵּשׁ לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד אֶת כָּל הַיְּהוּדִים<br>
    מִנַּעַר וְעַד זָקֵן טַף וְנָשִׁים בְּיוֹם אֶחָד<br>
    בִּשְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר וּשְׁלָלָם לָבוֹז.<br>
    וְאַתָּה בְרַחֲמֶיךָ הָרַבִּים הֵפַרְתָּ אֶת עֲצָתוֹ.<br>
    וְקִלְקַלְתָּ אֶת מַחֲשַׁבְתּוֹ.<br>
    וַהֲשֵׁבוֹתָ לּוֹ גְּמוּלוֹ בְּרֹאשׁוֹ.<br>
    וְתָלוּ אוֹתוֹ וְאֶת בָּנָיו עַל הָעֵץ.<br>
    <span class="highlight">וְעָשִׂיתָ עִמָּהֶם נֵס וָפֶלֶא וְנוֹדֶה לְשִׁמְךָ הַגָּדוֹל סֶלָה:</span>`;
  }
}

function selectYaaleh(name, btn) {
  document.querySelectorAll('.yaaleh-name').forEach(el => el.textContent = name);
  btn.closest('div').querySelectorAll('.month-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectMonth(name, btn) {
  document.querySelectorAll('.month-name-1, .month-name-2').forEach(el => {
    el.textContent = name;
  });
  document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectTzaddik(name, btn) {
  document.querySelectorAll('.tzaddik-name-1, .tzaddik-name-2, .tzaddik-name-3, .tzaddik-name-4').forEach(el => {
    el.textContent = name;
  });
  document.querySelectorAll('.tzaddik-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function updateSoldierPrayer(name) {
  const prayer = document.getElementById('soldierPrayer');
  const display = document.getElementById('soldierNameDisplay');
  if (name.trim()) {
    display.textContent = name.trim();
    prayer.style.display = 'block';
  } else {
    prayer.style.display = 'none';
  }
}

let autoScrollRAF = null;
let autoScrollSpeed = 0.8;
let isAutoScrolling = false;

function setManualScroll() {
  stopAutoScroll();
  document.getElementById('btnManual').classList.add('active');
  document.getElementById('btnAuto').classList.remove('active');
  document.getElementById('speedControl').classList.remove('visible');
}

function toggleAutoScroll() {
  if (isAutoScrolling) {
    stopAutoScroll();
    document.getElementById('btnAuto').classList.remove('active');
    document.getElementById('speedControl').classList.remove('visible');
  } else {
    startAutoScroll();
    document.getElementById('btnAuto').classList.add('active');
    document.getElementById('btnManual').classList.remove('active');
    document.getElementById('speedControl').classList.add('visible');
  }
}

function startAutoScroll() {
  isAutoScrolling = true;
  const content = document.querySelector('.prayer-content');
  function step() {
    if (!isAutoScrolling) return;
    content.scrollTop += autoScrollSpeed;
    if (content.scrollTop + content.clientHeight >= content.scrollHeight - 5) {
      stopAutoScroll();
      document.getElementById('btnAuto').classList.remove('active');
      document.getElementById('btnAuto').textContent = '✔ הסתיים';
      return;
    }
    autoScrollRAF = requestAnimationFrame(step);
  }
  autoScrollRAF = requestAnimationFrame(step);
}

function stopAutoScroll() {
  isAutoScrolling = false;
  cancelAnimationFrame(autoScrollRAF);
}

function updateScrollSpeed(val) {
  autoScrollSpeed = parseFloat(val) * 0.4;
}

// Fix keyboard dismiss - blur input without closing prayer
document.addEventListener('touchstart', function(e) {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') {
    if (!e.target.closest('input')) {
      document.activeElement.blur();
      e.stopPropagation();
    }
  }
}, true);

// Handle back button - works for both browser and WebView/APK
window.addEventListener('popstate', function(e) {
  const overlay = document.getElementById('prayerOverlay');
  if (overlay.classList.contains('active')) {
    closePrayer();
    history.pushState(null, '');
  }
});

// For WebToApp / Android WebView back button
document.addEventListener('backbutton', function(e) {
  e.preventDefault();
  const overlay = document.getElementById('prayerOverlay');
  if (overlay.classList.contains('active')) {
    closePrayer();
  }
}, false);

// Keep a history state always pushed so back doesn't exit
history.pushState(null, '');
window.addEventListener('popstate', function() {
  history.pushState(null, '');
  const overlay = document.getElementById('prayerOverlay');
  if (overlay.classList.contains('active')) {
    closePrayer();
  }
});

function openPrayer(id) {
  history.pushState({ prayer: id }, '');
  const p = prayers[id];
  document.getElementById('prayerTitle').textContent = p.title;
  document.getElementById('prayerBody').innerHTML = p.body;
  const overlay = document.getElementById('prayerOverlay');
  overlay.classList.add('active');
  overlay.querySelector('.prayer-content').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  setTimeout(applyFontSize, 10);

  // Show scroll controls only for mazon
  const controls = document.getElementById('scrollControls');
  if (id === 'mazon' || id === 'derech' || id === 'chayalim') {
    controls.classList.add('visible');
    document.getElementById('btnManual').classList.add('active');
    document.getElementById('btnAuto').classList.remove('active');
    document.getElementById('btnAuto').textContent = '▶ גלילה אוטומטית';
    document.getElementById('speedControl').classList.remove('visible');
    stopAutoScroll();
  } else {
    controls.classList.remove('visible');
    stopAutoScroll();
  }
}

function closePrayer() {
  document.getElementById('prayerOverlay').classList.remove('active');
  document.body.style.overflow = '';
  stopAutoScroll();
}

// Close on background tap
document.getElementById('prayerOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePrayer();
});

// Swipe down to close
let touchStartY = 0;
document.querySelector('.prayer-content').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
});
document.querySelector('.prayer-content').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientY - touchStartY;
  if (diff > 80 && document.querySelector('.prayer-content').scrollTop === 0) {
    closePrayer();
  }
});
</script>
